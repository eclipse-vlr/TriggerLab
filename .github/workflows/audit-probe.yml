name: Read-only audit probes
on:
  push:
    branches: ['audit/**']
permissions:
  contents: read
jobs:
  windows-audit:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure audit harness
        run: cmake -S . -B build-audit -G "Visual Studio 17 2022" -A x64
      - name: Build isolated diagnostic executable
        run: cmake --build build-audit --config Release --target TriggerLabAuditProbe --parallel
      - name: Exercise real UI commands with inert SendInput
        run: ./build-audit/Release/TriggerLabAuditProbe.exe
