name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, test and verify batch-launched window
        shell: pwsh
        run: |
          & $env:ComSpec /d /c 'call build-windows.bat <nul'
          if ($LASTEXITCODE -ne 0) { throw "Batch script failed: $LASTEXITCODE" }
          $executable = Join-Path $env:GITHUB_WORKSPACE 'build\Release\TriggerLab.exe'
          $apps = @(Get-Process -Name TriggerLab -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -eq $executable })
          if ($apps.Count -ne 1) {
            Get-Process | Where-Object { $_.ProcessName -like '*TriggerLab*' } |
              Format-List Id, ProcessName, Path, MainWindowHandle
            $probe = Start-Process -FilePath $executable -WorkingDirectory (Split-Path $executable) -PassThru
            try {
              if ($probe.WaitForExit(5000)) {
                Write-Host "Direct launch exit code: $($probe.ExitCode)"
              } else {
                $probe.Refresh()
                Write-Host "Direct launch remains alive: PID=$($probe.Id), HWND=$($probe.MainWindowHandle)"
              }
            } finally {
              if (-not $probe.HasExited) { Stop-Process -Id $probe.Id -Force }
            }
            throw "Expected one TriggerLab process launched by build-windows.bat; found $($apps.Count)."
          }
          $app = $apps[0]
          try {
            if (-not $app.WaitForInputIdle(10000)) {
              throw 'TriggerLab did not finish window initialization.'
            }
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) {
              throw 'TriggerLab exited or did not create a main window.'
            }
            Write-Host "PASS: build-windows.bat launched a live GUI window (PID $($app.Id))."
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TriggerLab-test-diagnostics
          path: |
            build-windows.log
            build/Testing/Temporary/LastTest.log
            build/Release/*test-report.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: TriggerLab-windows-x64
          path: |
            build/Release/TriggerLab.exe
            build/Release/TriggerLabCapturePreview.exe
            build/Release/TriggerLabTrainer.exe
          if-no-files-found: error
          retention-days: 14
      - name: Package portable preview
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build
      - name: Upload distribution archive
        uses: actions/upload-artifact@v7
        with:
          name: TriggerLab-portable-preview
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  portable-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify release recovery
        run: python3 tests/release_workflow_tests.py

  portable-sanitizers:
    name: Portable core with ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure instrumented Debug build
        run: >-
          cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitizers --parallel
      - name: Test under sanitizers
        run: ctest --test-dir build-sanitizers --output-on-failure --no-tests=error

  release:
    name: Publish versioned Windows release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, portable-core, portable-sanitizers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish ZIP and checksum after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          bash .github/scripts/publish-release.sh
