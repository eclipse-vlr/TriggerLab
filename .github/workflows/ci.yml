name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, test and verify batch-launched window
        shell: pwsh
        run: |
          & $env:ComSpec /d /c 'call build-windows.bat <nul'
          if ($LASTEXITCODE -ne 0) { throw "Batch script failed: $LASTEXITCODE" }
          $executable = Join-Path $env:GITHUB_WORKSPACE 'build\Release\TriggerLab.exe'
          $apps = @(Get-Process -Name TriggerLab -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -eq $executable })
          if ($apps.Count -ne 1) {
            Get-Process | Where-Object { $_.ProcessName -like '*TriggerLab*' } |
              Format-List Id, ProcessName, Path, MainWindowHandle
            $probe = Start-Process -FilePath $executable -WorkingDirectory (Split-Path $executable) -PassThru
            try {
              if ($probe.WaitForExit(5000)) {
                Write-Host "Direct launch exit code: $($probe.ExitCode)"
              } else {
                $probe.Refresh()
                Write-Host "Direct launch remains alive: PID=$($probe.Id), HWND=$($probe.MainWindowHandle)"
              }
            } finally {
              if (-not $probe.HasExited) { Stop-Process -Id $probe.Id -Force }
            }
            throw "Expected one TriggerLab process launched by build-windows.bat; found $($apps.Count)."
          }
          $app = $apps[0]
          try {
            if (-not $app.WaitForInputIdle(10000)) {
              throw 'TriggerLab did not finish window initialization.'
            }
            Start-Sleep -Seconds 3
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) {
              throw 'TriggerLab exited or did not create a main window.'
            }
            Write-Host "PASS: build-windows.bat launched a live GUI window (PID $($app.Id))."
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TriggerLab-test-diagnostics
          path: |
            build-windows.log
            build/Testing/Temporary/LastTest.log
            build/Release/*test-report.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: TriggerLab-windows-x64
          path: |
            build/Release/TriggerLab.exe
            build/Release/TriggerLabCapturePreview.exe
            build/Release/TriggerLabTrainer.exe
          if-no-files-found: error
          retention-days: 14
      - name: Package portable preview
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build
      - name: Upload distribution archive
        uses: actions/upload-artifact@v7
        with:
          name: TriggerLab-portable-preview
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  portable-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  release:
    name: Publish versioned Windows release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, portable-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish ZIP and checksum after successful tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(TriggerLab VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES CXX\)$/\1/p' CMakeLists.txt)
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          test -f "docs/releases/$version.md"
          gh run download "$GITHUB_RUN_ID" --name TriggerLab-portable-preview --dir release-assets
          archive="TriggerLab-$version-windows-x64.zip"
          (cd release-assets && sha256sum --check "$archive.sha256")
          gh release create "$tag" "release-assets/$archive" "release-assets/$archive.sha256" \
            --target "$GITHUB_SHA" --title "TriggerLab $version" \
            --notes-file "docs/releases/$version.md" --draft
          gh release edit "$tag" --draft=false --latest
