name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure MSVC x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Test core, configuration and Win32 window
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: TriggerLab-windows-x64
          path: |
            build/Release/TriggerLab.exe
            build/Release/TriggerLabCapturePreview.exe
            build/Release/TriggerLabTrainer.exe
          if-no-files-found: error
          retention-days: 14
      - name: Package portable preview
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build
      - name: Upload distribution archive
        uses: actions/upload-artifact@v7
        with:
          name: TriggerLab-portable-preview
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  portable-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
